[project]
name = "apuestasdeportivas-reports"
version = "0.1.0"
description = "Servicio de reportes del sistema de apuestas deportivas"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi[standard]",
  "pandas",
]

[dependency-groups]
dev = [
  "httpx",
  "pytest-cov",
  "pytest",
  "ruff",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
