name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gates:
    name: Lint, tipos, pruebas y SonarQube
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.9

      - name: Configure Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Configure Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Configure uv
        uses: astral-sh/setup-uv@v10

      - name: Install JavaScript workspace
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        run: uv sync --project apps/reports --frozen

      - name: Lint
        run: |
          pnpm lint
          pnpm reports:lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Install Playwright browser
        run: pnpm --filter @apuestasdeportivas/web exec playwright install --with-deps chromium

      - name: Test
        run: |
          pnpm test
          pnpm reports:test

      - name: SonarQube analysis and blocking quality gate
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.qualitygate.wait=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  deploy:
    name: Deploy after all quality gates pass
    needs: quality-gates
    if: github.event_name == 'push' && (github.ref_name == 'develop' || github.ref_name == 'main')
    uses: ./.github/workflows/deploy.yml
    with:
      target: ${{ github.ref_name == 'develop' && 'staging' || 'production' }}
    secrets: inherit
